<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LexPress | Recruitment 2027</title>
<style>
:root{--red:#a71920;--wine:#5c1018;--cream:#f8f1e6;--paper:#fffdf8;--ink:#241d1b;--muted:#776b65;--line:#e8ddd0;--gold:#c49a55}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,Arial}button,input,select,textarea{font:inherit}a{color:inherit}header{background:var(--wine);color:#fff;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:5} .brand{font:700 25px Georgia;letter-spacing:.5px}.brand span{color:#e8c78b}nav{display:flex;gap:10px;flex-wrap:wrap}nav button{border:1px solid #ffffff55;background:transparent;color:white;padding:9px 14px;border-radius:25px;cursor:pointer}nav button:hover{background:#ffffff18}
main{max-width:1150px;margin:auto;padding:30px 22px 70px}.hero{padding:45px 4%;border-radius:22px;background:linear-gradient(125deg,#5c1018,#a71920);color:#fff;position:relative;overflow:hidden}.hero:after{content:"⚖";position:absolute;right:4%;bottom:-60px;font-size:240px;opacity:.08}.eyebrow{text-transform:uppercase;letter-spacing:2.5px;font-size:12px;color:#e9c98e;font-weight:700}.hero h1{font:clamp(36px,6vw,65px)/1.05 Georgia;margin:14px 0}.hero p{max-width:650px;color:#f4e5df;font-size:17px}.btn{border:0;border-radius:9px;background:var(--red);color:white;padding:12px 18px;font-weight:700;cursor:pointer}.btn.light{background:#fff;color:var(--wine)}.btn.outline{background:transparent;color:var(--red);border:1px solid var(--red)}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:35px 0 16px}.sectionhead h2{font:30px Georgia;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.team{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;display:flex;flex-direction:column;min-height:205px}.team .icon{font-size:27px}.team h3{font:22px Georgia;margin:10px 0 5px}.team p{color:var(--muted);margin:0 0 18px;flex:1}.team button{align-self:flex-start}.notice{border-left:4px solid var(--gold);background:#fff8e9;padding:15px 18px;border-radius:8px;margin:20px 0}.footer{padding:25px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:25px;margin:20px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:650;font-size:13px}input,select,textarea{border:1px solid #d9cabe;border-radius:8px;background:white;padding:11px;color:var(--ink);width:100%}textarea{min-height:100px;resize:vertical}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{font-weight:500;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:8px}.checks input{width:auto}.hidden{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px}.kpi strong{font:30px Georgia;display:block;color:var(--wine)}.kpi span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f5eade;color:var(--wine)}.status{padding:4px 8px;border-radius:20px;background:#f4e6ce;font-size:11px;font-weight:700}.small{font-size:12px}.adminbar{display:flex;gap:8px;flex-wrap:wrap}.adminbar button{padding:8px 12px}.chart{display:flex;align-items:end;gap:12px;height:170px;padding:10px 0}.barcol{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{background:linear-gradient(#c64a4e,var(--wine));border-radius:6px 6px 0 0;min-height:3px;margin-bottom:8px}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:20px 14px}.formgrid{grid-template-columns:1fr}.hero{padding:30px 22px}.sectionhead{align-items:start;flex-direction:column}}
</style></head><body>
<header><div class="brand">⚖ Lex<span>Press</span></div><nav><button onclick="home()">Home</button><button onclick="showForm('all')">Apply</button><button onclick="admin()">Admin</button></nav></header>
<main id="app"></main><div class="footer">LexPress Plan 2027 · Recruitment & Membership · Built for aspiring legal minds</div>
<script>
// @ts-nocheck
const teams=[
["Teaching Team","📚","Teach, mentor and explain legal concepts to learners."],
["Founding Team","⚖️","Help shape the vision, culture and long-term direction."],
["Hiring Team","🧭","Support recruitment, screening and candidate coordination."],
["Planning Team","🗓️","Organise calendars, projects, events and execution."],
["Study Material & Editorial","✍️","Research, write, edit and prepare learning resources."],
["Social Media & Creativity","🎨","Create engaging visuals, posts and digital content."],
["PR & Marketing","📣","Build outreach, partnerships and public presence."],
["Office Works","🗂️","Support documentation, records and operations."]
];
let apps=JSON.parse(localStorage.getItem("lexpress_apps")||"[]"), adminOn=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("lexpress_apps",JSON.stringify(apps))}
function home(){adminOn=false;$("app").innerHTML=`<section class="hero"><div class="eyebrow">LexPress Plan · 2027</div><h1>Build ideas.<br>Shape futures.</h1><p>We're inviting curious, committed and creative people to join our teams. Find your place, contribute meaningfully, and grow with LexPress.</p><button class="btn light" onclick="showForm('all')">Explore opportunities →</button></section>
<div class="notice"><b>Remuneration policy:</b> Every Teaching Team member is paid. In all other teams, remuneration is reserved for the respective Team Head. Teaching Team applicants must choose at least one additional team; Teaching alone is not an eligible preference.</div>
<div class="sectionhead"><h2>Choose your team</h2><span class="muted">Applications are open to everyone with this link.</span></div><div class="grid">${teams.map((t,i)=>`<article class="team"><div class="icon">${t[1]}</div><h3>${t[0]}</h3><p>${t[2]}</p><button class="btn" onclick="showForm(${i})">Apply to team →</button></article>`).join("")}</div>
<div class="sectionhead"><h2>How it works</h2></div><div class="grid"><div class="team"><h3>01 · Apply</h3><p>Complete the form and share your interests.</p></div><div class="team"><h3>02 · Review</h3><p>Our team reviews applications and may invite you for an interview.</p></div><div class="team"><h3>03 · Join</h3><p>Selected applicants receive further instructions.</p></div></div>`}
function showForm(which){adminOn=false;let chosen=which==="all"?[]:[Number(which)];$("app").innerHTML=`<div class="sectionhead"><h2>Application form</h2><span class="muted">LexPress Plan 2027</span></div><div class="panel"><div class="notice">Teaching applicants must also select at least one other team. Please choose all teams you would like to be considered for.</div><form id="applyForm"><div class="formgrid">
<div class="field"><label>Full name *</label><input name="name" required placeholder="Your full name"></div><div class="field"><label>Email address *</label><input name="email" type="email" required></div>
<div class="field"><label>Phone / WhatsApp *</label><input name="phone" required></div><div class="field"><label>College / Institution *</label><input name="college" required></div>
<div class="field"><label>Course & year *</label><input name="course" required placeholder="e.g. BA LL.B., 1st year"></div><div class="field"><label>City *</label><input name="city" required></div>
<div class="field full"><label>Teams you're applying for *</label><div class="checks">${teams.map((t,i)=>`<label><input type="checkbox" name="teams" value="${i}" ${chosen.includes(i)?"checked":""}> ${t[0]}</label>`).join("")}</div></div>
<div class="field full"><label>Why do you want to join LexPress? *</label><textarea name="motivation" required placeholder="Tell us about your interests and motivation"></textarea></div>
<div class="field full"><label>Relevant skills / experience</label><textarea name="skills" placeholder="Writing, teaching, design, research, leadership…"></textarea></div>
<div class="field"><label>Weekly availability *</label><select name="availability" required><option value="">Select</option><option>2–4 hours</option><option>4–6 hours</option><option>6–10 hours</option><option>10+ hours</option></select></div>
<div class="field"><label>Portfolio / LinkedIn (optional)</label><input name="portfolio" placeholder="https://"></div>
<div class="field full"><label><input type="checkbox" name="agree" required style="width:auto"> I confirm these details are accurate and understand the remuneration policy.</label></div>
</div><p><button class="btn" type="submit">Submit application →</button> <button class="btn outline" type="button" onclick="home()">Cancel</button></p></form></div>`;
$("applyForm").onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),sel=fd.getAll("teams").map(Number);if(!sel.length){alert("Please select at least one team.");return}if(sel.includes(0)&&sel.length<2){alert("Teaching Team cannot be selected alone. Please select one additional team.");return}
let email=fd.get("email").toLowerCase();if(apps.some(a=>a.email===email)){alert("An application with this email already exists. Contact the recruitment team if you need to update it.");return}
let obj={id:"LX27-"+Math.random().toString(36).slice(2,8).toUpperCase(),name:fd.get("name"),email,phone:fd.get("phone"),college:fd.get("college"),course:fd.get("course"),city:fd.get("city"),teams:sel.map(i=>teams[i][0]),motivation:fd.get("motivation"),skills:fd.get("skills"),availability:fd.get("availability"),portfolio:fd.get("portfolio"),status:"New",date:new Date().toISOString(),head:false,notes:""};apps.push(obj);save();$("app").innerHTML=`<div class="panel" style="text-align:center;padding:50px"><div style="font-size:50px">✓</div><h2 style="font:32px Georgia">Application received!</h2><p>Your LexPress application has been recorded.</p><div class="notice"><b>Application ID: ${obj.id}</b><br>Keep this ID for your records.</div><button class="btn" onclick="home()">Back to homepage</button></div>`}}
function admin(){adminOn=true;$("app").innerHTML=`<div class="sectionhead"><h2>Master Admin</h2><span class="muted">Private recruitment workspace</span></div><div class="panel"><h3>Admin access</h3><p class="muted">This demo dashboard is local to this browser. Set a password on first use.</p><form id="login"><div class="field" style="max-width:400px"><label>Password</label><input id="pw" type="password" required></div><p><button class="btn">Continue</button></p></form><p class="small muted">First-time demo password: <b>LexPress27!</b> Change it in a production deployment.</p></div>`;$("login").onsubmit=e=>{e.preventDefault();if($("pw").value!==(localStorage.getItem("lexpress_pw")||"LexPress27!")){alert("Incorrect password");return}dash()}}
function dash(){let counts={};teams.forEach(t=>counts[t[0]]=apps.filter(a=>a.teams.includes(t[0])).length);let statuses=["New","Review","Shortlisted","Interview","Selected","Rejected","On hold"];let n=s=>apps.filter(a=>a.status===s).length;
$("app").innerHTML=`<div class="sectionhead"><h2>Recruitment overview</h2><div class="adminbar"><button class="btn outline" onclick="exportCSV()">Export CSV</button><button class="btn outline" onclick="logout()">Log out</button></div></div><div class="kpis"><div class="kpi"><strong>${apps.length}</strong><span>Total applications</span></div><div class="kpi"><strong>${n("Shortlisted")}</strong><span>Shortlisted</span></div><div class="kpi"><strong>${n("Interview")}</strong><span>Interview stage</span></div><div class="kpi"><strong>${n("Selected")}</strong><span>Selected</span></div><div class="kpi"><strong>${n("Rejected")}</strong><span>Rejected</span></div></div>
<div class="sectionhead"><h2>Team applications</h2></div><div class="panel"><div class="chart">${teams.map(t=>{let c=counts[t[0]],max=Math.max(1,...Object.values(counts));return `<div class="barcol"><div class="bar" style="height:${Math.max(4,c/max*125)}px"></div>${c}<br>${t[0].split(" ")[0]}</div>`}).join("")}</div></div>
<div class="sectionhead"><h2>Applicant records</h2><span class="muted">${apps.length} records</span></div><div class="toolbar"><input id="search" placeholder="Search name, email, college…" oninput="renderRows()"><select id="filter" onchange="renderRows()"><option value="">All statuses</option>${statuses.map(s=>`<option>${s}</option>`).join("")}</select><select id="teamfilter" onchange="renderRows()"><option value="">All teams</option>${teams.map(t=>`<option>${t[0]}</option>`).join("")}</select></div><div class="panel tablewrap"><table><thead><tr><th>ID</th><th>Applicant</th><th>Teams</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="sectionhead"><h2>Admin settings</h2></div><div class="panel"><label>Change dashboard password</label><div class="toolbar"><input id="newpw" type="password" placeholder="New password (8+ characters)"><button class="btn" onclick="changePW()">Save password</button><button class="btn outline" onclick="clearDemo()">Clear all applications</button></div><p class="small muted">Note: this standalone prototype stores data in this browser only. Production deployment needs server-side authentication and a shared database.</p></div>`;renderRows()}
function renderRows(){if(!$("rows"))return;let q=$("search").value.toLowerCase(),st=$("filter").value,tm=$("teamfilter").value;let list=apps.filter(a=>(!q||(a.name+a.email+a.college).toLowerCase().includes(q))&&(!st||a.status===st)&&(!tm||a.teams.includes(tm)));$("rows").innerHTML=list.map(a=>`<tr><td>${a.id}</td><td><b>${a.name}</b><br>${a.email}</td><td>${a.teams.join(", ")}</td><td><span class="status">${a.status}</span></td><td>${new Date(a.date).toLocaleDateString()}</td><td><button class="btn outline" onclick="detail('${a.id}')">Open</button></td></tr>`).join("")||`<tr><td colspan="6">No applications match.</td></tr>`}
function detail(id){let a=apps.find(x=>x.id===id);$("app").innerHTML=`<div class="sectionhead"><h2>Applicant profile</h2><button class="btn outline" onclick="dash()">← Back</button></div><div class="panel"><h2 style="font:28px Georgia">${a.name}</h2><p class="muted">${a.id} · ${a.email} · ${a.phone}</p><div class="grid"><div><b>Institution</b><p>${a.college} · ${a.course} · ${a.city}</p><b>Teams</b><p>${a.teams.join(", ")}</p><b>Availability</b><p>${a.availability}</p><b>Portfolio</b><p>${a.portfolio||"—"}</p></div><div><b>Motivation</b><p>${a.motivation}</p><b>Skills / experience</b><p>${a.skills||"—"}</p></div></div><div class="panel"><h3>Review & allocation</h3><div class="formgrid"><div class="field"><label>Status</label><select id="status">${["New","Review","Shortlisted","Interview","Selected","Rejected","On hold"].map(s=>`<option ${a.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Team head designation</label><select id="head"><option value="no" ${!a.head?"selected":""}>Not a head</option><option value="yes" ${a.head?"selected":""}>Designated head</option></select></div><div class="field full"><label>Admin notes / interview feedback</label><textarea id="notes">${a.notes||""}</textarea></div></div><p><button class="btn" onclick="updateApplicant('${a.id}')">Save review</button></p><div class="notice">Remuneration eligibility: ${a.teams.includes("Teaching Team")?"Teaching Team member (paid if appointed to Teaching).":"Non-teaching applicant (remuneration only if appointed as team head)."}</div></div>`}
function updateApplicant(id){let a=apps.find(x=>x.id===id);a.status=$("status").value;a.head=$("head").value==="yes";a.notes=$("notes").value;save();detail(id)}
function exportCSV(){let cols=["id","name","email","phone","college","course","city","teams","status","date","availability","motivation","skills","head","notes"];let csv=[cols.join(","),...apps.map(a=>cols.map(c=>`"${String(c==="teams"?a[c].join("; "):a[c]??"").replaceAll('"','""')}"`).join(","))].join("\n");let b=new Blob([csv],{type:"text/csv"}),u=URL.createObjectURL(b),x=document.createElement("a");x.href=u;x.download="LexPress_applications.csv";x.click();URL.revokeObjectURL(u)}
function changePW(){let v=$("newpw").value;if(v.length<8){alert("Use at least 8 characters");return}localStorage.setItem("lexpress_pw",v);alert("Password changed")}
function clearDemo(){if(confirm("Permanently clear all applications in this browser?")){apps=[];save();dash()}}
function logout(){adminOn=false;home()}
home();
</script></body></html>
